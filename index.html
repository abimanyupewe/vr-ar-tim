<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leviathan & Submarine AR - Natural Orbit with Controls</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #controlPanel {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 20px;
        border-radius: 10px;
        display: flex;
        gap: 10px;
        z-index: 10;
      }
      #controlPanel button {
        background: #007bff;
        border: none;
        color: white;
        padding: 10px 15px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        user-select: none;
        transition: background 0.3s;
      }
      #controlPanel button:hover {
        background: #0056b3;
      }
    </style>
  </head>

  <body>
    <!-- Kontrol Tombol -->
    <div id="controlPanel">
      <button onclick="moveSubmarine('forward')">▲ Forward</button>
      <button onclick="moveSubmarine('left')">◄ Left</button>
      <button onclick="moveSubmarine('right')">► Right</button>
      <button onclick="moveSubmarine('backward')">▼ Backward</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam;">
      <a-assets>
        <a-asset-item id="leviathanGhostModel" src="assets/ghost_leviathan.glb"></a-asset-item>
        <a-asset-item id="leviathanShadowModel" src="assets/shadow_leviathan.glb"></a-asset-item>
        <a-asset-item id="submarineModel" src="assets/submarine.glb"></a-asset-item>
        <audio id="deepSeaSound" src="assets/deepsea.mp3" preload="auto"></audio>
        <audio id="stormSound" src="assets/badai.mp3" preload="auto"></audio>
      </a-assets>

      <a-marker preset="custom" type="pattern" url="assets/markerpat.patt" size="1">
        <!-- Leviathan Ghost -->
        <a-entity
          id="leviathanGhost"
          position="0 0 0"
          rotation="0 0 0"
          scale="9 12 9"
          animation-mixer="loop: repeat"
          gltf-model="#leviathanGhostModel"
          gesture-handler
        ></a-entity>

        <!-- Leviathan Shadow -->
        <a-entity
          id="leviathanShadow"
          position="0 0 0"
          rotation="0 0 0"
          scale="9 12 9"
          animation-mixer="loop: repeat"
          gltf-model="#leviathanShadowModel"
          gesture-handler
        ></a-entity>

        <!-- Submarine -->
        <a-entity
          id="submarine"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.1 0.1 0.1"
          gltf-model="#submarineModel"
          gesture-handler
        ></a-entity>

        <!-- Audio -->
        <a-sound id="deepSeaAudio" src="#deepSeaSound" autoplay="false" loop="true"></a-sound>
        <a-sound id="stormAudio" src="#stormSound" autoplay="false" loop="true" volume="0.3"></a-sound>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const marker = document.querySelector("a-marker");
      const deepSeaAudio = document.querySelector("#deepSeaAudio");
      const stormAudio = document.querySelector("#stormAudio");

      const leviathanGhost = document.querySelector("#leviathanGhost");
      const leviathanShadow = document.querySelector("#leviathanShadow");
      const submarine = document.querySelector("#submarine");

      // Audio play/stop on marker found/lost
      marker.addEventListener("markerFound", () => {
        deepSeaAudio.components.sound.playSound();
        stormAudio.components.sound.playSound();
        // Start orbit animation
        animateOrbit();
      });

      marker.addEventListener("markerLost", () => {
        deepSeaAudio.components.sound.stopSound();
        stormAudio.components.sound.stopSound();
      });

      // Unlock audio on first user interaction (mobile)
      document.body.addEventListener("click", () => {
        const ctx = AFRAME.AFRAME.audioContext || new AudioContext();
        if (ctx.state === "suspended") {
          ctx.resume();
        }
      });

      // Orbit animation parameters
      let angle = 0; // current angle in radians
      const radiusGhost = 1.5; // radius of orbit for Ghost Leviathan
      const radiusShadow = 1.6; // radius of orbit for Shadow Leviathan
      const orbitSpeed = 0.005; // radians per frame (slower)
      const phaseShift = 0.2; // phase difference between Ghost and Shadow

      function animateOrbit() {
        // Update angle
        angle += orbitSpeed;
        if (angle > 2 * Math.PI) angle -= 2 * Math.PI;

        // Calculate new positions for Leviathan Ghost and Shadow with phase shift
        const ghostX = submarine.object3D.position.x + radiusGhost * Math.cos(angle);
        const ghostZ = submarine.object3D.position.z + radiusGhost * Math.sin(angle);

        const shadowX = submarine.object3D.position.x + radiusShadow * Math.cos(angle + phaseShift);
        const shadowZ = submarine.object3D.position.z + radiusShadow * Math.sin(angle + phaseShift);

        // Set positions
        leviathanGhost.setAttribute("position", { x: ghostX, y: 0, z: ghostZ });
        leviathanShadow.setAttribute("position", { x: shadowX, y: 0, z: shadowZ });

        // Rotate Leviathan models to face submarine for natural look
        const lookAtX = submarine.object3D.position.x;
        const lookAtZ = submarine.object3D.position.z;

        // Calculate rotation Y to face submarine
        const dxGhost = lookAtX - ghostX;
        const dzGhost = lookAtZ - ghostZ;
        const rotationYGhost = (Math.atan2(dxGhost, dzGhost) * 180) / Math.PI;

        const dxShadow = lookAtX - shadowX;
        const dzShadow = lookAtZ - shadowZ;
        const rotationYShadow = (Math.atan2(dxShadow, dzShadow) * 180) / Math.PI;

        leviathanGhost.setAttribute("rotation", { x: 0, y: rotationYGhost, z: 0 });
        leviathanShadow.setAttribute("rotation", { x: 0, y: rotationYShadow, z: 0 });

        // Continue animation if marker is still visible
        if (marker.object3D.visible) {
          requestAnimationFrame(animateOrbit);
        }
      }

      // Submarine movement control
      const moveStep = 0.1;

      function moveSubmarine(direction) {
        const pos = submarine.object3D.position;
        switch (direction) {
          case "forward":
            pos.z -= moveStep;
            break;
          case "backward":
            pos.z += moveStep;
            break;
          case "left":
            pos.x -= moveStep;
            break;
          case "right":
            pos.x += moveStep;
            break;
        }
        submarine.object3D.position.set(pos.x, pos.y, pos.z);
      }
    </script>
  </body>
</html>
